[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# === 1. Nginx (主入口: 8080) ===
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# === 2. Edge TTS (内部: 5050) ===
[program:edge-tts]
directory=/app/tts
command=/bin/bash -c "export API_KEY='1' && python3 app/server.py"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=5
environment=PORT=5050,HOST=0.0.0.0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# === 3. DeepSeek Free API (内部: 8000) ===
[program:deepseek]
directory=/app/deepseek
command=/bin/bash -c "PORT=8000 HOST=0.0.0.0 node --enable-source-maps --no-node-snapshot dist/index.mjs"
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
environment=PORT=8000,TZ=Asia/Shanghai,HOST=0.0.0.0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# === 4. QwenChat2Api (内部: 8001) ===
[program:qw]
directory=/app/qw
command=npm start
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
environment=PORT=8001,HOST=0.0.0.0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# === 5. Qwen2API (内部: 3000, 根目录) ===
[program:qwen]
directory=/app/qwen
command=npm start
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
environment=PORT=3000,SERVICE_PORT=3000,LISTEN_ADDRESS=0.0.0.0,CACHE_MODE=file,PM2_INSTANCES=1,NODE_OPTIONS="--max-old-space-size=160"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# === 6. 健康检查守护进程 ===
[program:health-check]
command=/bin/bash -c "while true; do /app/health-check.sh; sleep 30; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
