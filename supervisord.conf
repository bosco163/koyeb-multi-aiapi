[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:edge-tts]
directory=/app/tts
command=/bin/bash -c "export API_KEY='1' && python3 app/server.py"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=5
environment=PORT=5050,HOST=0.0.0.0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:deepseek]
directory=/app/deepseek
command=/bin/bash -c "PORT=8000 HOST=0.0.0.0 node --enable-source-maps --no-node-snapshot dist/index.mjs"
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
environment=PORT=8000,TZ=Asia/Shanghai,HOST=0.0.0.0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qw]
directory=/app/qw
command=npm start
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
environment=PORT=8001,HOST=0.0.0.0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qwen]
directory=/app/qwen
command=npm start
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
environment=PORT=3000,SERVICE_PORT=3000,LISTEN_ADDRESS=0.0.0.0,CACHE_MODE=file,PM2_INSTANCES=1,NODE_OPTIONS="--max-old-space-size=160"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
