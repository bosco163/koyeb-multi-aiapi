[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:edge-tts]
directory=/app/tts
command=/bin/bash -c "export API_KEY='1' && python3 app/server.py"
autostart=true
autorestart=true
environment=PORT=5050
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# DS2API 服务，根目录 /
[program:deepseek]
directory=/app/deepseek
command=/app/start-ds2api.sh
autostart=true
autorestart=true
environment=PORT=8000,TZ=Asia/Shanghai
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Qwen2API 服务，路径 /qwen/
[program:qwen]
directory=/app/qwen
command=/app/start-qwen.sh
autostart=true
autorestart=true
environment=PORT=3000,SERVICE_PORT=3000,LISTEN_ADDRESS=0.0.0.0,CACHE_MODE=file,PM2_INSTANCES=1,NODE_OPTIONS="--max-old-space-size=256"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Auto-switch 服务，路径 /auto-switch/
[program:auto-switch]
directory=/app/auto-switch
command=/app/start-auto-switch.sh
autostart=true
autorestart=true
environment=PORT=9000,API_KEY="",MAX_BODY_BYTES=209715200,UPSTREAM_TIMEOUT_MS=3600000,HEARTBEAT_INTERVAL_MS=15000,NODE_OPTIONS="--max-old-space-size=512"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
