server {
    listen 8080 default_server;

    # 1. Koyeb 健康检查端点
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    # 2. Nginx 状态页面
    location /nginx_status {
        stub_status;
        access_log off;
        allow all;
    }

    # 3. Edge TTS -> 5050
    location ^~ /v1/audio {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Qwen2API -> 3000 (路径 /qwen/)
    location /qwen/ {
        rewrite ^/qwen/(.*) /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        tcp_nodelay on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 5. Auto-switch -> 9000
    # 用法示例：
    # /auto-switch/https://api.openai.com/v1/chat/completions
    # /auto-switch/api.openai.com/v1/chat/completions
    location /auto-switch/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        tcp_nodelay on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 6. DS2API -> 8000 (根目录)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 流式输出支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        tcp_nodelay on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
