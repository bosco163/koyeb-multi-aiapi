server {
    # 监听 Koyeb 的入口端口
    listen 8080 default_server;

    # 1. Nginx 状态
    location /nginx_status {
        stub_status;
        access_log off;
        allow all;
    }

    # 2. Edge TTS -> 5050
    location ^~ /v1/audio {
        proxy_pass https://ss.lhyb.dpdns.org/http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # 3. Deepseek Free API -> 5001 (替换原来的DeepSeek2API)
    location /ds/ {
        rewrite ^/ds/(.*) /$1 break;
        proxy_pass https://ss.lhyb.dpdns.org/http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    # 4. QwenChat2Api -> 8000 (映射路径 /qw)
    location /qw/ {
        rewrite ^/qw/(.*) /$1 break;
        proxy_pass https://ss.lhyb.dpdns.org/http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 5. Root -> Qwen2API (内部: 3000)
    location / {
        proxy_pass https://ss.lhyb.dpdns.org/http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
