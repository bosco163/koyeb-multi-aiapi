worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    access_log /var/log/nginx/access.log;
    
    # Koyeb 健康检查 - 必须立即响应
    upstream backend {
        server 127.0.0.1:8080;
    }
    
    server {
        listen 8080 default_server;
        server_name _;
        
        # 强制禁用缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # 1. Koyeb 健康检查端点 - 必须返回 200 OK
        location = /healthz {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
        
        # 2. 主页 - 快速响应
        location = / {
            add_header Content-Type text/html;
            return 200 '<!DOCTYPE html><html><head><title>AI Services Status</title><meta charset="utf-8"><meta http-equiv="refresh" content="5"><style>body{font-family:Arial,sans-serif;max-width:800px;margin:40px auto;padding:20px;background:#f5f5f5}h1{color:#333}.status-box{padding:20px;background:white;border-radius:10px;margin:20px 0;box-shadow:0 2px 5px rgba(0,0,0,0.1)}.service{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.service:last-child{border-bottom:none}.name{font-weight:bold}.up{color:green;font-weight:bold}.down{color:red}.url{color:#666;font-size:0.9em}a{color:#007bff;text-decoration:none}a:hover{text-decoration:underline}</style></head><body><h1>🚀 AI 服务状态</h1><div class="status-box"><div class="service"><span class="name">DeepSeek API</span><span class="up">运行中</span></div><div class="url">访问: <a href="/ds/">/ds/</a></div></div><div class="status-box"><div class="service"><span class="name">QwenChat2Api</span><span class="up">运行中</span></div><div class="url">访问: <a href="/qw/">/qw/</a></div></div><div class="status-box"><div class="service"><span class="name">Qwen2API</span><span class="up">运行中</span></div><div class="url">访问: <a href="/api/">/api/</a></div></div><div class="status-box"><div class="service"><span class="name">Edge TTS</span><span class="up">运行中</span></div><div class="url">访问: <a href="/v1/audio">/v1/audio</a></div></div><p style="margin-top:30px;color:#666">页面每5秒自动刷新 • <a href="/healthz">健康检查</a></p></body></html>';
        }
        
        # 3. Nginx 状态
        location /nginx_status {
            stub_status;
            access_log off;
            allow all;
        }
        
        # 4. Edge TTS -> 5050
        location ^~ /v1/audio {
            proxy_pass http://127.0.0.1:5050;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            chunked_transfer_encoding on;
        }
        
        # 5. Deepseek -> 8000
        location /ds/ {
            rewrite ^/ds/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }
        
        # 6. QwenChat2Api -> 8001
        location /qw/ {
            rewrite ^/qw/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        # 7. Qwen2API -> 3000
        location /api/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        # 8. 默认错误处理
        location / {
            return 404 'Not Found';
        }
    }
}
